name: Publish npm
run-name: Release @rodkisten/roteador (${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag || 'latest' }})
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag
        type: choice
        required: true
        default: latest
        options: [latest, next]
permissions:
  contents: write
  id-token: write
concurrency:
  group: npm-release-roteador
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build and verify
        run: |
          pnpm build
          pnpm -r typecheck
          pnpm -r test
          pnpm lint
      - name: Create automatic patch changeset if none exists
        shell: bash
        run: |
          if ! find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            cat > .changeset/automatic-release.md <<'CHANGESET'
          ---
          "@rodkisten/roteador": patch
          ---

          Automated release for changes merged into main.
          CHANGESET
          fi
      - name: Apply Changesets versioning
        run: pnpm exec changeset version
      - name: Resolve release metadata
        id: package
        shell: bash
        run: |
          node -e 'const p=require("./packages/core/package.json");const fs=require("fs");fs.appendFileSync(process.env.GITHUB_OUTPUT,"name="+p.name+"\nversion="+p.version+"\n");'
      - name: Check npm publication
        id: npm
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build versioned package
        if: steps.npm.outputs.already_published == 'false'
        run: pnpm build
      - name: Publish via npm Trusted Publishing
        if: steps.npm.outputs.already_published == 'false'
        working-directory: packages/core
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag || 'latest' }}
        run: npm publish --access public --provenance --tag "$RELEASE_TAG"
      - name: Commit versions and create tag
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .changeset packages/core/package.json packages/cloudflare/package.json pnpm-lock.yaml CHANGELOG.md packages/core/CHANGELOG.md packages/cloudflare/CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${PACKAGE_VERSION}"
          fi
          tag="v${PACKAGE_VERSION}"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag"
          fi
          git push origin HEAD:main
          git push origin "$tag"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag || 'latest' }}
        run: |
          tag="v${PACKAGE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          if [ "$RELEASE_TAG" = "next" ]; then
            gh release create "$tag" --target "$tag" --title "$tag" --generate-notes --prerelease
          else
            gh release create "$tag" --target "$tag" --title "$tag" --generate-notes
          fi
