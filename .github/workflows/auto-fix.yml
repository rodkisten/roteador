name: Auto-fix formatting and lint
run-name: Auto-fix Prettier + ESLint (${{ github.event_name }})
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
concurrency:
  group: roteador-auto-fix
  cancel-in-progress: false
jobs:
  auto-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate Ploocky GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID || vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run safe automatic fixes
        run: |
          pnpm exec prettier --write .
          pnpm exec eslint . --fix
          pnpm exec prettier --write .
      - name: Create pull request when files changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Only include tracked source/config files; ignore lockfile churn
          # until the monorepo commits a canonical lockfile.
          git add -u
          if git diff --cached --quiet; then
            echo "No tracked formatting/lint changes to propose."
            exit 0
          fi

          branch="chore/auto-fix-${RUN_ID}"
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "style: apply Prettier and ESLint automatic fixes"
          git push --set-upstream origin "$branch"

          # GitHub may restrict workflow-created PRs depending on repository
          # Actions settings. Fail visibly instead of silently discarding fixes.
          gh pr create \
            --base main \
            --head "$branch" \
            --title "style: automatic Prettier and ESLint fixes" \
            --body "Automated formatting and safe ESLint fixes. Review changes before merging. This workflow does not publish packages or block deployments."
