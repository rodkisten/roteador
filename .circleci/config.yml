version: 2.1
jobs:
  check:
    docker:
      - image: cimg/node:24.11
    steps:
      - checkout
      - run: corepack enable
      - run: corepack prepare pnpm@12.18.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm -r typecheck
      - run: pnpm -r test
workflows:
  ci:
    jobs:
      - check
